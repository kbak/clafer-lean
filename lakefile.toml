name = "clafer"
version = "0.1.0"
# Validation controls native content-keyed caching via LAKE_ARTIFACT_CACHE.
# Every project module still undergoes fresh kernel replay and axiom auditing.
defaultTargets = ["DPGraph", "FormalCD", "Clafer"]

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "DPGraph"
globs = ["DPGraph", "DPGraph.**"]

[[lean_lib]]
name = "FormalCD"
globs = ["FormalCD", "FormalCD.**"]

[[lean_lib]]
name = "Clafer"
globs = ["Clafer", "Clafer.**"]
