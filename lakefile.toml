name = "clafer"
version = "0.1.0"
# Candidate libraries always rebuild in an isolated validation snapshot.
enableArtifactCache = false
defaultTargets = ["DPGraph", "FormalCD", "Clafer"]

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "DPGraph"
globs = ["DPGraph", "DPGraph.**"]

[[lean_lib]]
name = "FormalCD"
globs = ["FormalCD", "FormalCD.**"]

[[lean_lib]]
name = "Clafer"
globs = ["Clafer", "Clafer.**"]
